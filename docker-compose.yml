services:
  db:
    image: postgres:16-alpine
    container_name: hostel-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: hostel_saas
      POSTGRES_USER: hostel_saas_user
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: